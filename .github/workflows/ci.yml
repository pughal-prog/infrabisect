name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
        if: runner.os != 'Windows'
      - name: Test (Windows)
        run: go test -count=1 ./...
        if: runner.os == 'Windows'
      - name: Build
        run: go build -o bin/ ./cmd/infrabisect

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0

  demo:
    name: demo (dry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install ./cmd/infrabisect
      - name: Bisect the demo incident
        working-directory: examples/demo
        run: |
          sh setup.sh
          infrabisect run --report incident.md
          grep -q "standardize health endpoint" incident.md

  demo-kind:
    name: demo (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: go install ./cmd/infrabisect
      - name: Bisect the demo incident in kind
        working-directory: examples/demo
        run: |
          sh setup.sh
          docker pull nginx:1.27-alpine
          docker pull nginx:1.27.3-alpine
          infrabisect run -c infrabisect.kind.yaml --report incident.md
          grep -q "standardize health endpoint" incident.md
