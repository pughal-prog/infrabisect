version: 2
project_name: infrabisect

builds:
  - main: ./cmd/infrabisect
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

dockers:
  - image_templates:
      - "ghcr.io/pughalan/infrabisect:{{ .Version }}"
      - "ghcr.io/pughalan/infrabisect:latest"
    dockerfile: Dockerfile.release
    build_flag_templates:
      - --label=org.opencontainers.image.source=https://github.com/pughalan/infrabisect
      - --label=org.opencontainers.image.version={{ .Version }}

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
